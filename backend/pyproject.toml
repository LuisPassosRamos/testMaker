[project]
name = "prova-pronta"
version = "0.1.0"
description = "Organizador de provas e atividades escolares: extrai, confere, diagrama e envia para impressão."
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "python-docx>=1.2",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "Pillow>=10.4",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pytesseract>=0.3.13",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "aiosmtpd>=1.4", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "converter: needs LibreOffice or Microsoft Word to convert DOCX to PDF",
  "ocr: needs the Tesseract binary with Portuguese data",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI dependency injection idiom
